# FindHub+ from prebuilt images (ghcr.io) - paste the services and volumes into your docker-compose.yml,
# change APP_PASSWORD and run: docker compose up -d
# Panel: http://<server-ip>:47821  (server-only access: "127.0.0.1:47821:80")

services:
  findhub-gateway:
    image: ghcr.io/michalzaniewicz/findhub-plus-gateway:latest
    restart: unless-stopped
    depends_on:
      - findhub-app
    environment:
      APP_UPSTREAM: findhub-app:8000
      LOGIN_UPSTREAM: findhub-login:7900
    ports:
      - "47821:80"
    volumes:
      - findhub_caddy_data:/data

  findhub-app:
    image: ghcr.io/michalzaniewicz/findhub-plus-app:latest
    restart: unless-stopped
    depends_on:
      findhub-db:
        condition: service_healthy
    environment:
      APP_PASSWORD: change-me             # panel password
      DATABASE_URL: postgresql://findhub:findhub@findhub-db:5432/findhub
      LOGIN_SERVICE_URL: http://findhub-login:8001
      POLL_INTERVAL_SECONDS: "300"        # how often to poll tags, in seconds (can be changed in the panel)
      RETENTION_DAYS: "0"                 # 0 = keep history forever
      TZ: Europe/Warsaw
    volumes:
      - findhub_app_data:/data

  findhub-login:
    image: ghcr.io/michalzaniewicz/findhub-plus-login:latest
    restart: unless-stopped
    shm_size: "1gb"
    environment:
      CHROME_LANG: en
      TZ: Europe/Warsaw

  findhub-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: findhub
      POSTGRES_PASSWORD: findhub          # database reachable only on the Docker network
      POSTGRES_DB: findhub
    volumes:
      - findhub_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findhub -d findhub"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  findhub_app_data:
  findhub_pg_data:
  findhub_caddy_data:
