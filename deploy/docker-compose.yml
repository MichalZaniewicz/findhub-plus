# FindHub+ z gotowych obrazów (ghcr.io) - bez budowania na serwerze.
# Użycie: skopiuj ten plik i .env.example (jako .env) na serwer, ustaw APP_PASSWORD, `docker compose up -d`.
# Możesz też wkleić same usługi do swojego istniejącego docker-compose.yml.

services:
  findhub-gateway:
    image: ghcr.io/michalzaniewicz/findhub-plus-gateway:latest
    restart: unless-stopped
    depends_on:
      - findhub-app
    environment:
      APP_UPSTREAM: findhub-app:8000
      LOGIN_UPSTREAM: findhub-login:7900
    ports:
      # Panel dostępny w sieci lokalnej pod http://<ip-serwera>:8080.
      # Tylko z samego serwera: "127.0.0.1:8080:80" (wtedy np. tunel SSH).
      - "${FINDHUB_PORT:-8080}:80"
    volumes:
      - findhub_caddy_data:/data

  findhub-app:
    image: ghcr.io/michalzaniewicz/findhub-plus-app:latest
    restart: unless-stopped
    depends_on:
      findhub-db:
        condition: service_healthy
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?Ustaw APP_PASSWORD w pliku .env}
      DATABASE_URL: postgresql://findhub:${POSTGRES_PASSWORD:-findhub}@findhub-db:5432/findhub
      LOGIN_SERVICE_URL: http://findhub-login:8001
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-300}
      RETENTION_DAYS: ${RETENTION_DAYS:-0}
      TZ: ${TZ:-Europe/Warsaw}
    volumes:
      - findhub_app_data:/data

  findhub-login:
    image: ghcr.io/michalzaniewicz/findhub-plus-login:latest
    restart: unless-stopped
    shm_size: "1gb"
    environment:
      CHROME_LANG: ${CHROME_LANG:-pl}
      TZ: ${TZ:-Europe/Warsaw}

  findhub-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: findhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-findhub}
      POSTGRES_DB: findhub
    volumes:
      - findhub_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findhub -d findhub"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  findhub_app_data:
  findhub_pg_data:
  findhub_caddy_data:
