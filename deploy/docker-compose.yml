# FindHub+ z gotowych obrazów (ghcr.io) - wklej usługi i wolumeny do swojego docker-compose.yml,
# zmień APP_PASSWORD i uruchom: docker compose up -d
# Panel: http://<ip-serwera>:47821  (tylko z samego serwera: "127.0.0.1:47821:80")

services:
  findhub-gateway:
    image: ghcr.io/michalzaniewicz/findhub-plus-gateway:latest
    restart: unless-stopped
    depends_on:
      - findhub-app
    environment:
      APP_UPSTREAM: findhub-app:8000
      LOGIN_UPSTREAM: findhub-login:7900
    ports:
      - "47821:80"
    volumes:
      - findhub_caddy_data:/data

  findhub-app:
    image: ghcr.io/michalzaniewicz/findhub-plus-app:latest
    restart: unless-stopped
    depends_on:
      findhub-db:
        condition: service_healthy
    environment:
      APP_PASSWORD: zmien-to-haslo        # hasło do panelu
      DATABASE_URL: postgresql://findhub:findhub@findhub-db:5432/findhub
      LOGIN_SERVICE_URL: http://findhub-login:8001
      POLL_INTERVAL_SECONDS: "300"        # co ile sekund odpytywać tagi (można zmienić w panelu)
      RETENTION_DAYS: "0"                 # 0 = historia bez limitu
      TZ: Europe/Warsaw
    volumes:
      - findhub_app_data:/data

  findhub-login:
    image: ghcr.io/michalzaniewicz/findhub-plus-login:latest
    restart: unless-stopped
    shm_size: "1gb"
    environment:
      CHROME_LANG: pl
      TZ: Europe/Warsaw

  findhub-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: findhub
      POSTGRES_PASSWORD: findhub          # baza dostępna tylko w sieci Dockera
      POSTGRES_DB: findhub
    volumes:
      - findhub_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findhub -d findhub"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  findhub_app_data:
  findhub_pg_data:
  findhub_caddy_data:
