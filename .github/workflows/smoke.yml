name: Smoke test

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build & push images"]
    types: [completed]

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Start stack from published images
        working-directory: deploy
        run: |
          docker compose pull
          docker compose up -d
          docker compose ps

      - name: Run smoke test
        run: |
          pip install -q websockets
          python .github/smoke_test.py

      - name: Browser test (noVNC in panel)
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium > /dev/null
          mkdir -p shots
          python .github/browser_test.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.runner }}
          path: shots/

      - name: Screenshot of login display
        if: always()
        working-directory: deploy
        run: |
          docker compose exec -T findhub-login sh -c 'ls -la /tmp; for f in /tmp/*.log; do echo "== $f"; tail -n 40 "$f"; done; ps aux' || true

      - name: Container logs
        if: always()
        working-directory: deploy
        run: docker compose logs --no-color --tail 200
